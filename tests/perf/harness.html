<!doctype html>
<!--
  Loads the built engine (and three, for the renderer benchmark) as real ES
  modules and hangs them off `window` for each spec's page.evaluate() to use.
  dist/index.js imports "three" as a bare specifier (see vite.config.ts's
  external list); the import map below resolves it to the same CDN URL this
  file imports directly, so the browser's module cache gives both one
  instance instead of two.
-->
<html>
  <head>
    <!-- dist/index.js's own GLTFLoader and rapier imports (unused directly
         here, but pulled in transitively by the barrel) are also bare
         specifiers — bundling isn't in play for this harness, so all three
         need mapping. -->
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.module.js",
          "three/examples/jsm/loaders/GLTFLoader.js": "https://cdn.jsdelivr.net/npm/three@0.160.1/examples/jsm/loaders/GLTFLoader.js",
          "@dimforge/rapier3d-compat": "https://cdn.jsdelivr.net/npm/@dimforge/rapier3d-compat@0.14.0/rapier.es.js"
        }
      }
    </script>
  </head>
  <body>
    <script type="module">
      import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.module.js';
      import * as Speck from '../../dist/index.js';
      window.THREE = THREE;
      window.Speck = Speck;
      window.__ready = true;
    </script>
  </body>
</html>
