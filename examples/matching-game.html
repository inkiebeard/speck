<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>speck — matching game</title>
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #111; }
      canvas { display: block; }
    </style>
  </head>
  <body>
    <!-- OrbitControls (three/examples/jsm) imports "three" as a bare specifier
         internally, so the browser needs this map to resolve it. Points at the
         same URL matching-game.js imports directly, so both resolve to one
         module instance. -->
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.module.js"
        }
      }
    </script>
    <script type="module" src="./matching-game.js"></script>
  </body>
</html>
