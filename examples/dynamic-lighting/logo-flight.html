<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>speck — logo flight</title>
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #000002; }
      canvas { display: block; }
    </style>
  </head>
  <body>
    <!-- The engine barrel import pulls in GltfLoader (used to load logo.glb)
         and PhysicsSystem, whose "three"/GLTFLoader.js/rapier imports are
         bare specifiers; the browser needs this map to resolve them, to the
         same URLs logo-flight.js imports directly so everything resolves to
         one module instance. -->
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.module.js",
          "three/examples/jsm/loaders/GLTFLoader.js": "https://cdn.jsdelivr.net/npm/three@0.160.1/examples/jsm/loaders/GLTFLoader.js",
          "@dimforge/rapier3d-compat": "https://cdn.jsdelivr.net/npm/@dimforge/rapier3d-compat@0.14.0/rapier.es.js"
        }
      }
    </script>
    <script type="module" src="./logo-flight.js"></script>
  </body>
</html>
