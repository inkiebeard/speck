<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>speck — logo flight</title>
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #000002; }
      canvas { display: block; }
    </style>
  </head>
  <body>
    <!-- The engine's GltfLoader (used to load logo.glb) pulls in
         three/examples/jsm/loaders/GLTFLoader.js, which itself does a bare
         `import * as THREE from "three"` internally — the browser needs this
         map to resolve that. Points at the same URL logo-flight.js imports
         directly, so both resolve to one module instance. -->
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.module.js"
        }
      }
    </script>
    <script type="module" src="./logo-flight.js"></script>
  </body>
</html>
